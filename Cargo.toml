[package]
name = "mavparam"
version = "0.1.0"
authors = ["Matt Busel <matt@busel.dev>"]
edition = "2021"
rust-version = "1.71"
description = "Drone parameter files in Rust: read, write and diff ArduPilot / Mission Planner .param, MAVProxy .parm and QGroundControl .params, compared as float32 the way the autopilot stores them, with optional ArduPilot apm.pdef.json range, enum and reboot-required checks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mattbusel/mavparam"
homepage = "https://github.com/Mattbusel/mavparam"
documentation = "https://docs.rs/mavparam"
readme = "README.md"
keywords = ["ardupilot", "px4", "mavlink", "drone", "parameters"]
categories = ["aerospace::drones", "parser-implementations", "command-line-utilities", "no-std"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
default = ["std"]
## `std::error::Error` for the error types.
std = []
## Loads ArduPilot `apm.pdef.json` parameter metadata: units, ranges, enum values, bitmasks, reboot-required and read-only flags.
metadata = ["std", "dep:serde_json"]
## Builds the `mavparam` command line tool: `cargo install mavparam --features cli`.
cli = ["std", "metadata"]

[[bin]]
name = "mavparam"
path = "src/bin/mavparam.rs"
required-features = ["cli"]

[dependencies]
serde_json = { version = "1", optional = true }

[package.metadata.docs.rs]
all-features = true
